<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshUp | Carrito</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div id="header"></div>



    <main>


        <section class="page-header"style="
    min-height: 0 !important;
    height: auto !important;
    padding-top: 10px !important;
    padding-bottom: 10px !important;
    margin-bottom: 0 !important;
">

            <p class="eyebrow">
                <br>TU SELECCIÓN
            </p>

            <h1>
                Carrito
            </h1>

        </section>



        <section class="cart-section" style="
    margin-top: 0 !important;
">


            <div id="cart-items">

                <p class="empty-cart">
                    Tu carrito está vacío.
                </p>

            </div>



            <aside class="cart-summary">


                <h2>
                    Resumen
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="cart-subtotal">
                        $0.00
                    </strong>

                </div>



                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong id="cart-total">
                        $0.00
                    </strong>

                </div>



                <button class="btn" id="continuar-compra">
    Continuar
</button>

<div id="mensaje-compra" style="display: none; margin-top: 20px; text-align: center;">

    <h3>¡Gracias por tu compra! 🎉</h3>

    <p>
        Tu pedido ha sido registrado correctamente.
    </p>

    <p>
        <strong>XinUp! · $350.00</strong>
    </p>

</div>


            </aside>


        </section>


    </main>



    <div id="footer"></div>



    <script src="js/main.js"></script>

</body>

</html>
